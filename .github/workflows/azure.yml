# Deploys the backend to Azure Container Apps on every push to main that changes it.
# The repo has no CI workflow, so this runs on push (if one is added later, switch the
# trigger to `workflow_run` of that workflow; the checkout below already handles it).
#
# Login is OIDC with a managed identity: no secrets. It stays switched off until the
# repo owner sets the AZURE_* variables printed by deploy/github-setup.sh.
# This only swaps the image; settings are changed with deploy/azure.sh or the portal.
name: Deploy to Azure

on:
  push:
    branches: [main]
    # Frontend-only changes (Vercel) don't change the backend image, so they don't redeploy it
    paths:
      - "backend/**"
      - "agents/**"
      - "rag/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/azure.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-deploy-purva-main
  cancel-in-progress: false

env:
  APP_NAME: purva-main
  RESOURCE_GROUP: purva-main

jobs:
  deploy:
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build image
        env:
          ACR: ${{ vars.AZURE_ACR }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          IMAGE="$ACR.azurecr.io/$APP_NAME:${SHA::7}-$ATTEMPT"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 -t "$IMAGE" .

      - name: Push image
        env:
          ACR: ${{ vars.AZURE_ACR }}
        run: |
          az acr login --name "$ACR"
          docker push "$IMAGE"

      - name: Deploy new image
        run: |
          az containerapp update \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE" \
            --only-show-errors -o none

      - name: Wait for /health (up to 5 minutes)
        run: |
          fqdn="$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)"
          url="https://$fqdn/health"
          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            # The new revision must be the ready one, so an old copy answering doesn't count
            revs="$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
              --query "[properties.latestRevisionName, properties.latestReadyRevisionName]" -o tsv | tr '\n' ' ' || true)"
            read -r latest ready <<< "$revs" || true
            if [ -n "$latest" ] && [ "$latest" = "$ready" ] && reply="$(curl -fsS --max-time 10 "$url")"; then
              echo "Healthy: $reply"
              echo "Deployed $IMAGE to https://$fqdn" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Waiting (latest=$latest ready=$ready)..."
            sleep 10
          done
          echo "::error::$url did not answer within 5 minutes"
          az containerapp logs show -n "$APP_NAME" -g "$RESOURCE_GROUP" --tail 50 || true
          exit 1
