# Builds this app's image and uploads it to its repository in the shared Azure
# registry (purvashared82aaf9d4.azurecr.io/purva-main). It does NOT deploy:
# RishabhWDB/purva-platform does, usually within 5-15 minutes, and holds the
# app's settings. This repo's Azure identity can only upload images.
#
# Sign-in uses this repo's AZURE_* Actions variables; the registry comes from
# deploy/azure-deploy.conf.
name: Deploy to Azure

on:
  push:
    branches: [main]
    # Frontend-only changes (Vercel) don't change the backend image, so they don't redeploy it
    paths:
      - "backend/**"
      - "agents/**"
      - "rag/**"
      - "requirements.txt"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/azure.yml"
      - "deploy/azure-deploy.conf"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: azure-deploy-purva-main
  cancel-in-progress: false

env:
  APP_NAME: purva-main
  RESOURCE_GROUP: purva-main

jobs:
  deploy:
    if: vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Pick the registry (deploy/azure-deploy.conf, else the AZURE_ACR variable)
        env:
          VAR_ACR: ${{ vars.AZURE_ACR }}
        run: |
          acr="$(sed -n 's/^ACR_NAME=//p' deploy/azure-deploy.conf 2>/dev/null | tail -1 | tr -d '\r ')"
          [ -n "$acr" ] || acr="$VAR_ACR"
          echo "$acr" | grep -Eq '^[a-z0-9]{5,50}$' || { echo "::error::bad registry name '$acr'"; exit 1; }
          echo "ACR=$acr" >> "$GITHUB_ENV"
          echo "Registry: $acr"

      - name: Build image
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          IMAGE="$ACR.azurecr.io/$APP_NAME:${SHA::7}-$ATTEMPT"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 -t "$IMAGE" .

      - name: Push image
        run: |
          az acr login --name "$ACR"
          docker push "$IMAGE"

      - name: Hand over to purva-platform (it deploys the image)
        env:
          UPLOADED: ${{ env.IMAGE }}
        run: |
          echo "::notice::Uploaded $UPLOADED. RishabhWDB/purva-platform deploys it, usually within 5-15 minutes."
          {
            echo "### Uploaded \`$UPLOADED\`"
            echo "Goes live within about 5-15 minutes: https://github.com/RishabhWDB/purva-platform/actions"
          } >> "$GITHUB_STEP_SUMMARY"
