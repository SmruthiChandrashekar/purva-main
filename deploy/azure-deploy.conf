# Azure names for purva-main (committed; NOTHING SECRET goes in here).
# Read by the shared-registry scripts (deploy/shared-registry-setup.sh,
# deploy/use-shared-registry.sh) and by .github/workflows/azure.yml for the
# registry name. deploy/azure.sh and deploy/github-setup.sh keep their own
# built-in names and only read SHARED_ACR_NAME and ACR_NAME from here.
# Format: KEY=value, one per line, no quotes.

# Container app, its resource group and deploy identity purva-main-github are all
# named after this.
APP_NAME=purva-main
AZURE_SUBSCRIPTION_ID=82aaf9d4-d161-4dab-8ecf-dff34de35353
AZURE_LOCATION=centralindia
# Shared Container Apps environment's group (never changed by any script).
ACA_ENV_RESOURCE_GROUP=purva-bot

# --- Shared container registry (one for every project) ---
# All projects keep their images in this ONE registry, each in its own
# repository named after APP_NAME and allowed to reach only that one.
# Created once by deploy/shared-registry-setup.sh; this project moves to it
# with deploy/use-shared-registry.sh (see deploy/SHARED-REGISTRY.md).
SHARED_ACR_NAME=purvashared82aaf9d4
SHARED_ACR_RESOURCE_GROUP=purva-shared

# Registry the deploy workflow pushes to and the app pulls from: this
# project's own (old) one, or the shared one above (written by
# deploy/use-shared-registry.sh). If empty, the workflow falls back to the
# AZURE_ACR Actions variable.
ACR_NAME=purvamain82aaf9d4
